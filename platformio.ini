; Beyblade X 戰鬥計分器 — Waveshare ESP32-S3-Touch-LCD-1.85B
;
; 硬體設定依據官方 ESP-IDF 範例的 sdkconfig.defaults：
;   CONFIG_ESPTOOLPY_FLASHMODE_QIO / FLASHSIZE_16MB
;   CONFIG_SPIRAM_MODE_OCT / SPIRAM_SPEED_80M   -> PSRAM 為 Octal(OPI)
;   CONFIG_ESP_DEFAULT_CPU_FREQ_MHZ_240
; 因此 memory_type 必須是 qio_opi，用錯會開不了機或 PSRAM 認不到。

[platformio]
default_envs = waveshare_s3_lcd185b

; 本機專屬設定（燒錄埠等）放這個檔案，不進版控 —— 埠名每台機器都不一樣，
; 寫死在版控裡對 clone 下來的人只會是錯的值。檔案不存在時會自動略過。
; 範例見 platformio_local.ini.example。
extra_configs = platformio_local.ini

; ---------------------------------------------------------------------------
; 韌體環境
; ---------------------------------------------------------------------------
[env:waveshare_s3_lcd185b]
; PlatformIO 官方 espressif32 平台仍停在 Arduino core 2.0.x，
; 無法建置官方 Arduino-V3.2.0 範例，故改用 pioarduino fork。
; 54.03.20 = ESP-IDF 5.4 + Arduino core 3.2.0，與官方範例版本一致。
platform = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.20/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino

board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.f_flash = 80000000L
board_build.f_cpu = 240000000L
board_build.partitions = partitions.csv
board_upload.flash_size = 16MB
; 必須等於 partitions.csv 裡 app0 的大小 (0x400000)。PlatformIO 不會從自訂
; 分割表推導這個值，留空會沿用板子預設的 8MB，導致韌體超出 app0 也不報錯。
; 改動 partitions.csv 的 app0 大小時，這裡要跟著改。
board_upload.maximum_size = 4194304

; upload_port / monitor_port 刻意不寫在這裡，設在 platformio_local.ini。
;
; 開發機上如果同時接著別片 ESP32，不指定埠的話 PlatformIO 可能燒到錯的板子
; —— 這在本專案實際發生過。1.85B 的特徵是 16MB 外部 flash + 8MB PSRAM，
; 用 `pio device list` 確認是哪一個埠。
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time

; src/probe/ 是獨立的診斷韌體，有自己的 setup()/loop()，
; 混進正式韌體會與 main.cpp 衝突。
build_src_filter = +<*> -<probe/>

build_flags =
    -D BOARD_HAS_PSRAM
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D ARDUINO_USB_MODE=1
    ; 讓 lvgl 找到 include/lv_conf.h
    -D LV_CONF_INCLUDE_SIMPLE
    -I include
    -I src
    -I src/bsp
    -I src/drivers
    -D CORE_DEBUG_LEVEL=1

build_unflags =
    -std=gnu++11

build_src_flags =
    -std=gnu++17

lib_deps =
    lvgl/lvgl@8.4.0

; ---------------------------------------------------------------------------
; 開發用韌體：與正式版相同，額外開啟序列埠除錯指令
;   pio run -e debug_serial -t upload
;   .venv/bin/python tools/screenshot.py --screen 3 -o shot.png
; 's' 截圖、數字鍵切畫面、'a'/'b' 模擬得分。板子不在手邊時用這個驗收 UI。
; 正式版不編進去 —— 這些指令能繞過所有 UI 直接改比賽狀態。
; ---------------------------------------------------------------------------
[env:debug_serial]
extends = env:waveshare_s3_lcd185b
build_flags = ${env:waveshare_s3_lcd185b.build_flags} -D BEY_DEBUG_SERIAL=1

; ---------------------------------------------------------------------------
; 音訊硬體診斷韌體
;   pio run -e audio_probe -t upload && pio device monitor
; 掃 I2C 確認 ES8311/ES7210 是否存在、印麥克風音量條、每 4 秒播一次嗶聲。
; 懷疑喇叭或麥克風沒發聲時先跑這個，確認硬體真的焊了。
; ---------------------------------------------------------------------------
; probe/ 底下每支診斷韌體都有自己的 setup()/loop()，filter 必須指到單一檔案，
; 用 +<probe/> 會把它們全部編進來，撞成重複定義。
[env:audio_probe]
extends = env:waveshare_s3_lcd185b
build_src_filter = -<*> +<probe/audio_probe.cpp> +<drivers/>

; ---------------------------------------------------------------------------
; 實測數據擷取韌體
;   pio run -e bringup_probe -t upload
;   .venv/bin/python tools/serial_watch.py -s 20
; dump BQ27220 暫存器（確認 SOC 到底在哪個位址）並印出字型實際字寬
; （版面的 maxR 計算至今都是估的）。只讀不寫。
; ---------------------------------------------------------------------------
[env:bringup_probe]
extends = env:waveshare_s3_lcd185b
build_src_filter = -<*> +<probe/bringup_probe.cpp> +<bsp/I2C_Driver.cpp> +<ui/fonts/>

; ---------------------------------------------------------------------------
; 觸控／手勢診斷韌體
;   pio run -e touch_probe -t upload
; 開機直接進測試畫面：畫出手指軌跡、目前座標、距圓心半徑、累積轉角，
; 以及 CST816 回報的手勢。用來調手勢的判定門檻。
; 獨立韌體而不是正式韌體裡的一個畫面 —— 測手勢時不該有轉場動畫、
; 狀態晶片、音效在旁邊干擾。
; ---------------------------------------------------------------------------
[env:touch_probe]
extends = env:waveshare_s3_lcd185b
build_src_filter = -<*> +<probe/touch_probe.cpp> +<bsp/> +<app/gesture.cpp>

; ---------------------------------------------------------------------------
; 實體按鍵診斷韌體
;   pio run -e button_probe -t upload
; 板上的 PWR / BOOT 接到哪支 GPIO 沒有任何文件記載（官方只有原理圖 PDF）。
; 這支把候選腳位設成上拉輸入，按下去哪支變 0 就知道是哪支。
; ---------------------------------------------------------------------------
[env:button_probe]
extends = env:waveshare_s3_lcd185b
build_src_filter = -<*> +<probe/button_probe.cpp> +<bsp/> +<app/gesture.cpp>

; ---------------------------------------------------------------------------
; 主機端單元測試環境（在 Mac 上跑，不需要板子）
;   pio test -e native
; 計分核心 lib/match 刻意不依賴 Arduino，才能在這裡測。
; ---------------------------------------------------------------------------
[env:native]
platform = native
test_framework = unity
build_flags =
    -std=c++17
    -I lib/match/include
test_build_src = no
